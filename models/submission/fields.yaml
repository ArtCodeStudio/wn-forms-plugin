fields:
    form_label:
        label: Formular
        type: text
        span: left
        readOnly: true
    created_at:
        label: Eingegangen am
        # Winter has no "datetime" form-field type (that exists only for list
        # columns) — use the datepicker widget in datetime mode. Rendering the
        # bare "datetime" type threw SystemException: partial _field_datetime
        # not found, which 500'd the whole submission detail view.
        type: datepicker
        mode: datetime
        span: right
        readOnly: true

    name:
        label: Name
        type: text
        span: left
    email:
        label: E-Mail
        type: text
        span: right

    status:
        label: Status
        type: dropdown
        span: left
        options:
            new: Neu
            read: Gelesen
            done: Erledigt

    data:
        label: Übermittelte Felder
        type: partial
        path: $/jumplink/forms/models/submission/_data_field.htm
        span: full
